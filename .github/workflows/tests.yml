name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: nicoechaniz/collective-memory
          ref: d12d4d22b36a8bfe17676eaf033ad077ab26c44c
          path: .collective-memory-contract
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-dev.txt
            requirements-hermes-contract.txt
            requirements-vectors.txt
      - run: python -m pip install -r requirements-dev.txt -r requirements-vectors.txt
      - run: python -m ruff format --check src tools/check_distribution.py tools/check_tribe_provenance.py tools/generate_dm021_vectors.py tools/generate_dm022_vectors.py tools/generate_dm030_vectors.py tools/generate_dm031_vectors.py tools/generate_dm032_vectors.py tools/generate_dm033_vectors.py tools/generate_dm034_vectors.py tools/generate_dm035_vectors.py tools/generate_dm040_vectors.py tools/generate_dm041_vectors.py tools/generate_dm079_vectors.py tools/reproducible_build.py tools/scan_secrets.py tests/test_package_scaffold.py tests/test_dm021_identity.py tests/test_dm021_keystore.py tests/test_dm021_process.py tests/test_dm021_vectors.py tests/test_dm022_ledger.py tests/test_dm023_sync.py tests/test_dm024_service.py tests/test_dm024_runtime.py tests/test_dm025_client.py tests/test_dm025_cli_mcp.py tests/test_dm026_conformance.py tests/test_dm030_memory_policy.py tests/test_dm031_curator.py tests/test_dm032_curator_worker.py tests/test_dm033_human_review.py tests/test_dm034_memory_projection.py tests/test_dm035_publication.py tests/test_dm037_cluster_effects.py tests/test_dm040_codex_body.py tests/test_dm041_hermes_body.py tests/test_dm050_tribe_provenance.py tests/test_dm051_sealed.py tests/test_dm052_communication.py tests/test_dm053_routes.py tests/test_dm054_scopes.py tests/test_dm079_authority_epochs.py
      - run: python -m ruff check src tools/check_distribution.py tools/check_tribe_provenance.py tools/generate_dm021_vectors.py tools/generate_dm022_vectors.py tools/generate_dm030_vectors.py tools/generate_dm031_vectors.py tools/generate_dm032_vectors.py tools/generate_dm033_vectors.py tools/generate_dm034_vectors.py tools/generate_dm035_vectors.py tools/generate_dm040_vectors.py tools/generate_dm041_vectors.py tools/generate_dm079_vectors.py tools/reproducible_build.py tools/scan_secrets.py tests/test_package_scaffold.py tests/test_dm021_identity.py tests/test_dm021_keystore.py tests/test_dm021_process.py tests/test_dm021_vectors.py tests/test_dm022_ledger.py tests/test_dm023_sync.py tests/test_dm024_service.py tests/test_dm024_runtime.py tests/test_dm025_client.py tests/test_dm025_cli_mcp.py tests/test_dm026_conformance.py tests/test_dm030_memory_policy.py tests/test_dm031_curator.py tests/test_dm032_curator_worker.py tests/test_dm033_human_review.py tests/test_dm034_memory_projection.py tests/test_dm035_publication.py tests/test_dm037_cluster_effects.py tests/test_dm040_codex_body.py tests/test_dm041_hermes_body.py tests/test_dm050_tribe_provenance.py tests/test_dm051_sealed.py tests/test_dm052_communication.py tests/test_dm053_routes.py tests/test_dm054_scopes.py tests/test_dm079_authority_epochs.py
      - run: MYPYPATH=src python -m mypy src tools/check_distribution.py tools/check_tribe_provenance.py tools/generate_dm021_vectors.py tools/generate_dm022_vectors.py tools/generate_dm030_vectors.py tools/generate_dm031_vectors.py tools/generate_dm032_vectors.py tools/generate_dm033_vectors.py tools/generate_dm034_vectors.py tools/generate_dm035_vectors.py tools/generate_dm040_vectors.py tools/generate_dm041_vectors.py tools/generate_dm079_vectors.py tools/reproducible_build.py tools/scan_secrets.py tests/test_package_scaffold.py tests/test_dm021_identity.py tests/test_dm021_keystore.py tests/test_dm021_process.py tests/test_dm021_vectors.py tests/test_dm022_ledger.py tests/test_dm023_sync.py tests/test_dm024_service.py tests/test_dm024_runtime.py tests/test_dm025_client.py tests/test_dm025_cli_mcp.py tests/test_dm026_conformance.py tests/test_dm030_memory_policy.py tests/test_dm031_curator.py tests/test_dm032_curator_worker.py tests/test_dm033_human_review.py tests/test_dm034_memory_projection.py tests/test_dm035_publication.py tests/test_dm037_cluster_effects.py tests/test_dm040_codex_body.py tests/test_dm041_hermes_body.py tests/test_dm050_tribe_provenance.py tests/test_dm051_sealed.py tests/test_dm052_communication.py tests/test_dm053_routes.py tests/test_dm054_scopes.py tests/test_dm079_authority_epochs.py
      - run: python -m ruff format --check tools/generate_dm042_vectors.py tests/test_dm042_local_we.py
      - run: python -m ruff check tools/generate_dm042_vectors.py tests/test_dm042_local_we.py
      - run: MYPYPATH=src python -m mypy tools/generate_dm042_vectors.py tests/test_dm042_local_we.py
      - run: python -m ruff format --check tools/generate_dm036_vectors.py tests/test_dm036_collective_memory.py
      - run: python -m ruff check tools/generate_dm036_vectors.py tests/test_dm036_collective_memory.py
      - run: MYPYPATH=src python -m mypy tools/generate_dm036_vectors.py tests/test_dm036_collective_memory.py
      - run: python tools/generate_dm041_vectors.py --check
      - run: python tools/generate_dm042_vectors.py --check
      - run: python tools/generate_dm036_vectors.py --check
        env:
          COLLECTIVE_MEMORY_CONTRACT_ROOT: ${{ github.workspace }}/.collective-memory-contract
      - run: python -m compileall -q coordination src tools tests
      - run: PYTHONPATH=src python -W error::ResourceWarning -m unittest discover -s tests -v
        env:
          COLLECTIVE_MEMORY_CONTRACT_ROOT: ${{ github.workspace }}/.collective-memory-contract
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: nicoechaniz/hermes-memory-kit
          ref: f10fd5c3089c0962920314c97e14bc024feffa7a
          path: .hmk-contract
      - run: PYTHONPATH=src python -W error::ResourceWarning -m unittest tests.test_dm034_memory_projection -v
        env:
          HMK_CONTRACT_ROOT: ${{ github.workspace }}/.hmk-contract
      - run: python tools/check_tribe_provenance.py provenance/tribe-bridge-v1.json

  hermes-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-hermes-contract.txt
            requirements-vectors.txt
      - run: python -m pip install -r requirements-dev.txt -r requirements-hermes-contract.txt -r requirements-vectors.txt
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: nicoechaniz/hermes-agent
          ref: 0db1912911fafa384aa5ee0145929658a9d1dd33
          path: .hermes-contract
      - name: Verify real Hermes plugin discovery and turn composition
        env:
          DAIMON_DM041_HERMES_SOURCE: ${{ github.workspace }}/.hermes-contract
        run: |
          chmod -R go-w .hermes-contract
          DAIMON_DM041_HERMES_PYTHON="$(command -v python)" PYTHONPATH=src python -W error::ResourceWarning -m unittest tests.test_dm041_hermes_body.RealHermesImportTests -v

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - run: python tools/reproducible_build.py --output dist
      - run: python tools/scan_secrets.py . dist/daimon_matrix-0.0.0.tar.gz dist/daimon_matrix-0.0.0-py3-none-any.whl
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: nicoechaniz/collective-memory
          ref: d12d4d22b36a8bfe17676eaf033ad077ab26c44c
          path: .collective-memory-contract
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: nicoechaniz/hermes-memory-kit
          ref: f10fd5c3089c0962920314c97e14bc024feffa7a
          path: .hmk-contract
      - name: Smoke-test the installed wheel
        env:
          HMK_CONTRACT_ROOT: ${{ github.workspace }}/.hmk-contract
          COLLECTIVE_MEMORY_CONTRACT_ROOT: ${{ github.workspace }}/.collective-memory-contract
        run: |
          python -m venv "${RUNNER_TEMP}/dm020-wheel"
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -m pip install -r requirements-vectors.txt
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -m pip install mcp==2.0.0
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -m pip install --no-deps dist/daimon_matrix-0.0.0-py3-none-any.whl
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -c 'import importlib.metadata as m; import daimon_matrix; assert daimon_matrix.__version__ == "0.0.0"; assert m.requires("daimon-matrix") == ["cryptography==50.0.0", "mcp==2.0.0"]'
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -c 'from daimon_matrix.identity import create_genesis, verify_genesis; roots=[bytes([n])*32 for n in (1,2,3)]; recovery=[bytes([n])*32 for n in (4,5,6)]; artifact=create_genesis(roots,2,recovery,2,created_at_ms=1); assert verify_genesis(artifact).being_ref.startswith("dm:being:v1:")'
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -c 'from daimon_matrix.ledger import Ledger; from daimon_matrix.weave import BeingManifest; assert Ledger and BeingManifest'
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -c 'from daimon_matrix.collective_memory import create_source_manifest, create_publisher_manifest; assert create_source_manifest()["adapter_id"] != create_publisher_manifest()["adapter_id"]'
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -c 'from daimon_matrix.sealed import PROFILE; from cryptography.hazmat.primitives.hpke import Suite; assert PROFILE.startswith("HPKE-X25519") and Suite'
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -W error::ResourceWarning -m unittest tests.test_dm022_ledger -q
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -W error::ResourceWarning -m unittest tests.test_dm023_sync -q
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -W error::ResourceWarning -m unittest tests.test_dm031_curator -q
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -W error::ResourceWarning -m unittest tests.test_dm032_curator_worker -q
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -W error::ResourceWarning -m unittest tests.test_dm033_human_review -q
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -W error::ResourceWarning -m unittest tests.test_dm034_memory_projection -q
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -W error::ResourceWarning -m unittest tests.test_dm035_publication.DM035PublicContractTests -q
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -W error::ResourceWarning -m unittest tests.test_dm036_collective_memory.DM036ContractTests -q
          "${RUNNER_TEMP}/dm020-wheel/bin/daimon-matrixd" --help
          "${RUNNER_TEMP}/dm020-wheel/bin/daimon" --help
          "${RUNNER_TEMP}/dm020-wheel/bin/daimon-conformance" --help
          "${RUNNER_TEMP}/dm020-wheel/bin/daimon-codex-body" --help
          "${RUNNER_TEMP}/dm020-wheel/bin/daimon-curator-worker" --help
          "${RUNNER_TEMP}/dm020-wheel/bin/daimon-hermes-body" --help
          "${RUNNER_TEMP}/dm020-wheel/bin/daimon-mcp" --help
          "${RUNNER_TEMP}/dm020-wheel/bin/daimon-reviewer" --help
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -W error::ResourceWarning -m unittest tests.test_dm040_codex_body -q
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -W error::ResourceWarning -m unittest tests.test_dm041_hermes_body -q
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -W error::ResourceWarning -m unittest tests.test_dm042_local_we -q
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -W error::ResourceWarning -m unittest tests.test_dm024_service tests.test_dm024_runtime tests.test_dm025_client tests.test_dm025_cli_mcp tests.test_dm026_conformance tests.test_dm030_memory_policy tests.test_dm037_cluster_effects tests.test_dm051_sealed tests.test_dm052_communication tests.test_dm053_routes tests.test_dm054_scopes tests.test_dm079_authority_epochs -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daimon-matrix-python-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-vectors.txt
      - run: python -m pip install -r requirements-build.txt -r requirements-vectors.txt
      - run: python tools/reproducible_build.py --output dist
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: nicoechaniz/hermes-memory-kit
          ref: f10fd5c3089c0962920314c97e14bc024feffa7a
          path: .hmk-contract
      - name: Run installed deterministic conformance twice
        env:
          HMK_CONTRACT_ROOT: ${{ github.workspace }}/.hmk-contract
        run: |
          python -m venv "${RUNNER_TEMP}/dm026-wheel"
          "${RUNNER_TEMP}/dm026-wheel/bin/python" -m pip install -r requirements-vectors.txt mcp==2.0.0
          "${RUNNER_TEMP}/dm026-wheel/bin/python" -m pip install --no-deps dist/daimon_matrix-0.0.0-py3-none-any.whl
          mkdir -p reports
          "${RUNNER_TEMP}/dm026-wheel/bin/daimon-conformance" --registry conformance/registry-v1.json --source-commit "${GITHUB_SHA}" --seed dm026-v1 --output reports/dm026-a.json --artifact wheel=dist/daimon_matrix-0.0.0-py3-none-any.whl --artifact sdist=dist/daimon_matrix-0.0.0.tar.gz
          "${RUNNER_TEMP}/dm026-wheel/bin/daimon-conformance" --registry conformance/registry-v1.json --source-commit "${GITHUB_SHA}" --seed dm026-v1 --output reports/dm026-b.json --artifact wheel=dist/daimon_matrix-0.0.0-py3-none-any.whl --artifact sdist=dist/daimon_matrix-0.0.0.tar.gz
          cmp reports/dm026-a.json reports/dm026-b.json
          python tools/scan_secrets.py reports dist/daimon_matrix-0.0.0.tar.gz dist/daimon_matrix-0.0.0-py3-none-any.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dm026-conformance-${{ github.sha }}
          path: reports/dm026-a.json
          if-no-files-found: error
