name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.scope.outputs.profile }}
      native_checks: ${{ steps.scope.outputs.native_checks }}
      group_receipt_checks: ${{ steps.scope.outputs.group_receipt_checks }}
      group_receiving_checks: ${{ steps.scope.outputs.group_receiving_checks }}
      group_admission_checks: ${{ steps.scope.outputs.group_admission_checks }}
      group_migration_only: ${{ steps.scope.outputs.group_migration_only }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: scope
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
        run: python3 tools/ci_scope.py --base "$CI_BASE" --pull-request-head "$CI_PR_HEAD"

  resource-docs:
    name: repository documentation
    needs: scope
    if: needs.scope.outputs.profile == 'resource-docs' || needs.scope.outputs.profile == 'context-docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: python3 -W error::ResourceWarning -m unittest tests.test_ci_scope -v
      - run: python3 tools/check_frozen_invariants.py --skip-generated

  release-compatibility:
    name: installed receiving release contract (3.13.5)
    needs: scope
    if: needs.scope.outputs.profile == 'release-compatibility'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-dev.txt
            requirements-vectors.txt
      - run: python -m pip install -r requirements-build.txt -r requirements-dev.txt -r requirements-vectors.txt wasmtime==45.0.0
      - run: python tools/check_frozen_invariants.py --skip-generated
      - run: python tools/generate_dm041_vectors.py --check
      - run: python -m ruff format --check src/daimon_matrix/release_compatibility.py tests/test_release_compatibility.py tools/ci_scope.py tests/test_ci_scope.py tools/reproducible_build.py tools/check_distribution.py tests/test_package_scaffold.py tests/test_dm041_hermes_body.py
      - run: python -m ruff check src/daimon_matrix/release_compatibility.py tests/test_release_compatibility.py tools/ci_scope.py tests/test_ci_scope.py tools/reproducible_build.py tools/check_distribution.py tests/test_package_scaffold.py tests/test_dm041_hermes_body.py
      - run: MYPYPATH=src python -m mypy src/daimon_matrix/release_compatibility.py
      - run: python -W error::ResourceWarning -m unittest tests.test_package_scaffold -v
      - name: Build exact wheel and qualify installed descriptor
        run: |
          python tools/reproducible_build.py --output dist
          python tools/scan_secrets.py dist
          python -I -S -c 'import runpy, sys; sys.path.append(sys.argv[1]); runpy.run_module("daimon_matrix.release_compatibility", run_name="__main__")' dist/daimon_matrix-0.1.0rc1-py3-none-any.whl > "$RUNNER_TEMP/dm-candidate-reader.json"
          python -m venv "$RUNNER_TEMP/dm-release-contract"
          "$RUNNER_TEMP/dm-release-contract/bin/python" -m pip install -r requirements-vectors.txt mcp==2.0.0 wasmtime==45.0.0 dist/*.whl
          echo "$RUNNER_TEMP/dm-release-contract/bin" >> "$GITHUB_PATH"
      - name: Installed comparison and public package evidence
        run: |
          python - <<'PYCODE'
          import daimon_matrix
          import json, os
          from pathlib import Path
          from daimon_matrix.release_compatibility import describe_reader
          assert Path.cwd() not in Path(daimon_matrix.__file__).resolve().parents
          assert describe_reader() == json.loads((Path(os.environ["RUNNER_TEMP"]) / "dm-candidate-reader.json").read_text())
          PYCODE
          python -W error::ResourceWarning -m unittest tests.test_release_compatibility tests.test_ci_scope tests.test_dm041_hermes_body.PublicContractTests -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receiving-release-contract-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  agent-chat-installer:
    name: installed agent-chat installer (3.13.5)
    needs: scope
    if: needs.scope.outputs.profile == 'agent-chat-installer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt .
      - run: python tools/check_frozen_invariants.py --skip-generated
      - run: python -m ruff format --check tools/install_agent_chat.py tools/ci_scope.py tests/test_agent_chat.py tests/test_ci_scope.py
      - run: python -m ruff check tools/install_agent_chat.py tools/ci_scope.py tests/test_agent_chat.py tests/test_ci_scope.py
      - run: MYPYPATH=src python -m mypy tools/install_agent_chat.py
      - run: python -W error::ResourceWarning -m unittest tests.test_ci_scope tests.test_agent_chat -v

  peer:
    name: native peer tools (3.13.5)
    needs: scope
    if: needs.scope.outputs.profile == 'peer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt .
      - run: python -m ruff format --check tools/chat_link.py tests/test_chat_link.py tests/test_chat_host.py tools/ci_scope.py tests/test_ci_scope.py
      - run: python -m ruff check tools/chat_link.py tests/test_chat_link.py tests/test_chat_host.py tools/ci_scope.py tests/test_ci_scope.py
      - run: python -W error::ResourceWarning -m unittest tests.test_ci_scope tests.test_chat_link tests.test_chat_host -v

  messaging:
    name: installed native messaging (3.13.5)
    needs: scope
    if: needs.scope.outputs.profile == 'messaging'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements-vectors.txt
      - name: Create owner-local installed SDK environment
        run: |
          python -m venv "$RUNNER_TEMP/dm-messaging-sdk"
          echo "$RUNNER_TEMP/dm-messaging-sdk/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r requirements-dev.txt -r requirements-vectors.txt .
      - run: python tools/check_frozen_invariants.py --skip-generated
      - run: python tools/generate_dm041_vectors.py --check
      - run: python -m ruff format --check src/daimon_matrix/messaging.py src/daimon_matrix/messaging_store.py tests/test_native_messaging.py tests/test_messaging_runtime.py tools/chat_link.py tests/test_chat_link.py tools/ci_scope.py tests/test_ci_scope.py
      - run: python -m ruff check src/daimon_matrix/messaging.py src/daimon_matrix/messaging_store.py tests/test_native_messaging.py tests/test_messaging_runtime.py tools/chat_link.py tests/test_chat_link.py tools/ci_scope.py tests/test_ci_scope.py
      - run: MYPYPATH=src python -m mypy src/daimon_matrix/messaging.py
      - name: Installed package and public contract evidence
        run: >-
          python -W error::ResourceWarning -m unittest
          tests.test_ci_scope tests.test_package_scaffold
          tests.test_dm041_hermes_body.PublicContractTests -v
      - name: Native authorization, encrypted delivery, revocation and retry
        run: >-
          python -W error::ResourceWarning -m unittest
          tests.test_messaging_runtime tests.test_operator_messaging
          tests.test_native_messaging tests.test_passive_messaging_execution
          tests.test_runtime_relationship_authority tests.test_cross_being_semantic_receipts
          tests.test_dm051_sealed tests.test_dm052_communication tests.test_dm053_routes -v

  visibility:
    name: installed readable native egress (3.13.5)
    needs: scope
    if: needs.scope.outputs.profile == 'visibility'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
            requirements-vectors.txt
      - run: python -m pip install -r requirements-dev.txt -r requirements-vectors.txt wasmtime==45.0.0
      - run: python tools/check_frozen_invariants.py --skip-generated
      - run: python tools/generate_dm041_vectors.py --check
      - run: python -m ruff format --check src tools/chat_link.py tools/install_agent_chat.py tools/ci_scope.py tests/test_ci_scope.py tests/test_agent_chat.py tests/test_labels.py tests/test_mandatory_echo.py tests/test_messaging_runtime.py tests/test_operator_messaging.py tests/test_telegram_mirror.py
      - run: python -m ruff check src tools/chat_link.py tools/install_agent_chat.py tools/ci_scope.py tests/test_ci_scope.py tests/test_agent_chat.py tests/test_labels.py tests/test_mandatory_echo.py tests/test_messaging_runtime.py tests/test_operator_messaging.py tests/test_telegram_mirror.py
      - run: MYPYPATH=src python -m mypy src tools/install_agent_chat.py
      - name: Source inventory and hostile artifact boundary
        run: python -W error::ResourceWarning -m unittest tests.test_package_scaffold -v
      - name: Reproducible qualified wheel and secret scan
        run: |
          python tools/reproducible_build.py --output dist
          python tools/scan_secrets.py dist
          python -m venv "$RUNNER_TEMP/dm-readable"
          "$RUNNER_TEMP/dm-readable/bin/python" -m pip install -r requirements-vectors.txt mcp==2.0.0 wasmtime==45.0.0 dist/*.whl
          echo "$RUNNER_TEMP/dm-readable/bin" >> "$GITHUB_PATH"
      - name: Installed package provenance and public contract
        run: |
          python - <<'PYCODE'
          import daimon_matrix
          from pathlib import Path
          assert Path.cwd() not in Path(daimon_matrix.__file__).resolve().parents
          PYCODE
          python -W error::ResourceWarning -m unittest tests.test_dm041_hermes_body.PublicContractTests -v
      - name: Presentation, response validation, retained proof and real HTTP lifecycle
        run: >-
          python -W error::ResourceWarning -m unittest
          tests.test_ci_scope tests.test_labels tests.test_agent_chat
          tests.test_neutral_binding.SkillDiscoveryTests.test_cli_emits_packaged_chat_and_composed_profile_without_changing_inputs
          tests.test_telegram_mirror tests.test_telegram_executor_portability
          tests.test_mandatory_echo tests.test_mandatory_echo_integration
          tests.test_chat_link tests.test_chat_host -v
      - name: Native delivery, current authority, installed runtime and successor rollback
        if: needs.scope.outputs.native_checks != 'false'
        run: >-
          python -W error::ResourceWarning -m unittest
          tests.test_messaging_runtime tests.test_operator_messaging
          tests.test_native_messaging tests.test_passive_messaging_execution
          tests.test_runtime_relationship_authority tests.test_cross_being_semantic_receipts
          tests.test_dm024_runtime tests.test_dm024_service tests.test_dm025_cli_mcp
          tests.test_dm051_sealed tests.test_dm052_communication tests.test_dm053_routes
          tests.test_dm055_peer_transport tests.test_closed_visibility_provisioning -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readable-native-egress-${{ github.sha }}
          path: dist/
          if-no-files-found: error


  authority-adoption:
    name: installed authority adoption (3.13.5)
    needs: scope
    if: needs.scope.outputs.profile == 'authority-adoption'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
            requirements-vectors.txt
      - run: python -m pip install -r requirements-dev.txt -r requirements-vectors.txt wasmtime==45.0.0
      - run: python tools/check_frozen_invariants.py --skip-generated
      - run: python tools/generate_dm041_vectors.py --check
      - run: python -m ruff check src tools/ci_scope.py tests/test_ci_scope.py tests/test_operator_messaging.py
      - run: python -m ruff format --check src tools/ci_scope.py tests/test_ci_scope.py tests/test_operator_messaging.py
      - run: MYPYPATH=src python -m mypy src
      - name: Source inventory and artifact build boundary
        run: python -W error::ResourceWarning -m unittest tests.test_package_scaffold -v
      - run: python tools/reproducible_build.py --output dist
      - run: python tools/scan_secrets.py dist
      - run: |
          python -m venv "$RUNNER_TEMP/dm-authority"
          "$RUNNER_TEMP/dm-authority/bin/python" -m pip install -r requirements-vectors.txt mcp==2.0.0 wasmtime==45.0.0 dist/*.whl
          echo "$RUNNER_TEMP/dm-authority/bin" >> "$GITHUB_PATH"
      - name: Installed history, exact successor, retained acceptance and native HTTP contracts
        run: >-
          python -W error::ResourceWarning -m unittest
          tests.test_ci_scope
          tests.test_dm041_hermes_body.PublicContractTests
          tests.test_dm079_authority_epochs tests.test_republish_after_advance
          tests.test_operator_messaging tests.test_chat_host
          tests.test_runtime_relationship_authority tests.test_cross_being_semantic_receipts
          tests.test_messaging_runtime tests.test_native_messaging -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: authority-adoption-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  tribe-group:
    name: installed membership group (3.13.5)
    needs: scope
    if: needs.scope.outputs.profile == 'tribe-group'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
            requirements-vectors.txt
      - run: python -m pip install -r requirements-dev.txt -r requirements-vectors.txt wasmtime==45.0.0
      - run: python tools/check_frozen_invariants.py --skip-generated
      - run: python tools/generate_dm041_vectors.py --check
      - run: python -m ruff check src tools/ci_scope.py tests/test_ci_scope.py tests/test_group_messaging_runtime.py tests/test_dm053_routes.py tests/test_release_compatibility.py tests/test_receiving_runtime.py tests/test_dm079_capability_profiles.py tests/test_operator_runtime_upgrade.py
      - run: python -m ruff format --check src tools/ci_scope.py tests/test_ci_scope.py tests/test_group_messaging_runtime.py tests/test_dm053_routes.py tests/test_release_compatibility.py tests/test_receiving_runtime.py tests/test_dm079_capability_profiles.py tests/test_operator_runtime_upgrade.py
      - run: MYPYPATH=src python -m mypy src
      - run: python tools/reproducible_build.py --output dist
      - run: python tools/scan_secrets.py dist
      - name: Install the qualified SDK once
        run: |
          python -m venv "$RUNNER_TEMP/dm-group"
          "$RUNNER_TEMP/dm-group/bin/python" -m pip install -r requirements-vectors.txt mcp==2.0.0 wasmtime==45.0.0 dist/*.whl
          echo "$RUNNER_TEMP/dm-group/bin" >> "$GITHUB_PATH"
      - name: Group delivery and corrected membership contracts
        if: needs.scope.outputs.group_migration_only != 'true'
        # The prior installed qualification exercised all 432 affected contracts;
        # preserve its passing evidence and recheck the changed expectations plus
        # the complete group journey instead of repeating unrelated journeys.
        run: >-
          python -W error::ResourceWarning -m unittest
          tests.test_ci_scope tests.test_dm041_hermes_body.PublicContractTests
          tests.test_native_messaging.NativeMessagingDaemonLifecycleTests.test_shutdown_waits_for_inflight_messaging_intake
          tests.test_group_messaging_runtime
          tests.test_agent_chat
          tests.test_neutral_binding.SkillDiscoveryTests.test_cli_emits_packaged_chat_and_composed_profile_without_changing_inputs
          tests.test_dm053_routes.BoundedTransportTests
          tests.test_dm053_routes.InboxAndProtocolTests
          tests.test_release_compatibility
          tests.test_mandatory_echo.EchoTests.test_closed_policy_projection_and_control_registry
          tests.test_telegram_mirror.CompactEchoRenderTests
          tests.test_single_active_tribe -v
      - name: Changed receipt codec and membership rules
        if: needs.scope.outputs.group_receipt_checks != 'false'
        # The closed bounded-transport profile reuses PR350's installed proof;
        # communication/Tribe/membership edits keep this codec qualification.
        run: >-
          python -W error::ResourceWarning -m unittest
          tests.test_cross_being_semantic_receipts
          tests.test_dm051_sealed.TribeConversationLaneTests
          tests.test_dm082_relationships.RelationshipContractTests.test_expired_cards_remove_grants_but_preserve_signed_membership
          tests.test_dm082_relationships.RelationshipContractTests.test_one_sided_consent_and_unaccepted_grant_are_inert
          tests.test_dm082_relationships.RelationshipContractTests.test_tribe_admission_does_not_require_bilateral_consent_or_grants -v
      - name: Changed group admission, visibility and native API contracts
        if: needs.scope.outputs.group_admission_checks == 'true'
        run: >-
          python -W error::ResourceWarning -m unittest
          tests.test_operator_messaging tests.test_closed_visibility_provisioning
          tests.test_dm025_cli_mcp -v
      - name: Installed resumable communication migration
        if: needs.scope.outputs.group_migration_only == 'true' || needs.scope.outputs.group_admission_checks == 'true'
        run: >-
          python -W error::ResourceWarning -m unittest
          tests.test_ci_scope tests.test_dm041_hermes_body.PublicContractTests
          tests.test_operator_communication_migration -v
      - name: Installed receiving control and unchanged legacy capability loading
        if: needs.scope.outputs.group_receiving_checks == 'true'
        run: >-
          python -W error::ResourceWarning -m unittest
          tests.test_receiving_runtime
          tests.test_dm079_capability_profiles
          tests.test_operator_runtime_upgrade.CurrentCapabilityUpgradeTests
          tests.test_dm024_runtime.RuntimeBundleTests
          tests.test_dm024_service.HostedServiceTests
          tests.test_dm025_client.LocalClientTests -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: membership-group-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  human-tribu:
    name: installed passive human Tribu (3.13.5)
    needs: scope
    if: needs.scope.outputs.profile == 'human-tribu'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-vectors.txt
            pyproject.toml
      - run: python -m pip install -r requirements-dev.txt -r requirements-vectors.txt wasmtime==45.0.0
      - run: python tools/check_frozen_invariants.py --skip-generated
      - run: python tools/generate_dm041_vectors.py --check
      - run: python -m ruff format --check src/daimon_matrix/human_tribu.py src/daimon_matrix/human_tribu_process.py src/daimon_matrix/telegram_mirror.py tests/test_human_tribu.py tests/test_human_tribu_process.py tools/ci_scope.py tests/test_ci_scope.py
      - run: python -m ruff check src/daimon_matrix/human_tribu.py src/daimon_matrix/human_tribu_process.py src/daimon_matrix/telegram_mirror.py tests/test_human_tribu.py tests/test_human_tribu_process.py tools/ci_scope.py tests/test_ci_scope.py
      - run: MYPYPATH=src python -m mypy src/daimon_matrix/human_tribu.py src/daimon_matrix/human_tribu_process.py src/daimon_matrix/telegram_mirror.py tests/test_human_tribu.py tests/test_human_tribu_process.py
      - name: Source inventory and hostile artifact boundary
        run: python -W error::ResourceWarning -m unittest tests.test_package_scaffold.PackageMetadataTests tests.test_package_scaffold.ArtifactBoundaryTests.test_closed_inventories_cover_actual_package_modules tests.test_package_scaffold.ArtifactBoundaryTests.test_allowlists_are_frozen tests.test_package_scaffold.ArtifactBoundaryTests.test_reproducible_build_inputs_match_sdist_sources -v
      - name: Reproducible wheel and secret scan
        run: |
          python tools/reproducible_build.py --output dist
          python tools/scan_secrets.py dist
          python -m venv "$RUNNER_TEMP/dm-human-tribu"
          "$RUNNER_TEMP/dm-human-tribu/bin/python" -m pip install -r requirements-vectors.txt mcp==2.0.0 wasmtime==45.0.0 dist/*.whl
          echo "$RUNNER_TEMP/dm-human-tribu/bin" >> "$GITHUB_PATH"
      - name: Installed SDK, passive provenance, paired authority, TLS and native socket
        run: |
          python -c 'import daimon_matrix; from pathlib import Path; assert Path.cwd() not in Path(daimon_matrix.__file__).resolve().parents'
          python -W error::ResourceWarning -m unittest tests.test_ci_scope tests.test_dm041_hermes_body.PublicContractTests tests.test_human_tribu tests.test_human_tribu_process tests.test_telegram_mirror tests.test_telegram_executor_portability tests.test_mandatory_echo tests.test_mandatory_echo_integration -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: passive-human-tribu-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  archive:
    name: portable archive tools (3.13.5)
    needs: scope
    if: needs.scope.outputs.profile == 'archive' || needs.scope.outputs.profile == 'protected-archive'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
