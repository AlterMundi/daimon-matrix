name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-dev.txt
            requirements-vectors.txt
      - run: python -m pip install -r requirements-dev.txt -r requirements-vectors.txt
      - run: python -m ruff format --check src tools/check_distribution.py tools/generate_dm021_vectors.py tools/generate_dm022_vectors.py tools/reproducible_build.py tools/scan_secrets.py tests/test_package_scaffold.py tests/test_dm021_identity.py tests/test_dm021_keystore.py tests/test_dm021_process.py tests/test_dm021_vectors.py tests/test_dm022_ledger.py tests/test_dm023_sync.py tests/test_dm024_service.py tests/test_dm024_runtime.py tests/test_dm025_client.py tests/test_dm025_cli_mcp.py tests/test_dm026_conformance.py
      - run: python -m ruff check src tools/check_distribution.py tools/generate_dm021_vectors.py tools/generate_dm022_vectors.py tools/reproducible_build.py tools/scan_secrets.py tests/test_package_scaffold.py tests/test_dm021_identity.py tests/test_dm021_keystore.py tests/test_dm021_process.py tests/test_dm021_vectors.py tests/test_dm022_ledger.py tests/test_dm023_sync.py tests/test_dm024_service.py tests/test_dm024_runtime.py tests/test_dm025_client.py tests/test_dm025_cli_mcp.py tests/test_dm026_conformance.py
      - run: MYPYPATH=src python -m mypy src tools/check_distribution.py tools/generate_dm021_vectors.py tools/generate_dm022_vectors.py tools/reproducible_build.py tools/scan_secrets.py tests/test_package_scaffold.py tests/test_dm021_identity.py tests/test_dm021_keystore.py tests/test_dm021_process.py tests/test_dm021_vectors.py tests/test_dm022_ledger.py tests/test_dm023_sync.py tests/test_dm024_service.py tests/test_dm024_runtime.py tests/test_dm025_client.py tests/test_dm025_cli_mcp.py tests/test_dm026_conformance.py
      - run: python -m compileall -q coordination src tools tests
      - run: PYTHONPATH=src python -W error::ResourceWarning -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - run: python tools/reproducible_build.py --output dist
      - run: python tools/scan_secrets.py . dist/daimon_matrix-0.0.0.tar.gz dist/daimon_matrix-0.0.0-py3-none-any.whl
      - name: Smoke-test the installed wheel
        run: |
          python -m venv "${RUNNER_TEMP}/dm020-wheel"
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -m pip install -r requirements-vectors.txt
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -m pip install mcp==2.0.0
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -m pip install --no-deps dist/daimon_matrix-0.0.0-py3-none-any.whl
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -c 'import importlib.metadata as m; import daimon_matrix; assert daimon_matrix.__version__ == "0.0.0"; assert m.requires("daimon-matrix") == ["cryptography<47,>=46.0.7", "mcp==2.0.0"]'
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -c 'from daimon_matrix.identity import create_genesis, verify_genesis; roots=[bytes([n])*32 for n in (1,2,3)]; recovery=[bytes([n])*32 for n in (4,5,6)]; artifact=create_genesis(roots,2,recovery,2,created_at_ms=1); assert verify_genesis(artifact).being_ref.startswith("dm:being:v1:")'
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -c 'from daimon_matrix.ledger import Ledger; from daimon_matrix.weave import BeingManifest; assert Ledger and BeingManifest'
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -W error::ResourceWarning -m unittest tests.test_dm022_ledger -q
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -W error::ResourceWarning -m unittest tests.test_dm023_sync -q
          "${RUNNER_TEMP}/dm020-wheel/bin/daimon-matrixd" --help
          "${RUNNER_TEMP}/dm020-wheel/bin/daimon" --help
          "${RUNNER_TEMP}/dm020-wheel/bin/daimon-conformance" --help
          "${RUNNER_TEMP}/dm020-wheel/bin/daimon-mcp" --help
          "${RUNNER_TEMP}/dm020-wheel/bin/python" -W error::ResourceWarning -m unittest tests.test_dm024_service tests.test_dm024_runtime tests.test_dm025_client tests.test_dm025_cli_mcp tests.test_dm026_conformance -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daimon-matrix-python-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-vectors.txt
      - run: python -m pip install -r requirements-build.txt -r requirements-vectors.txt
      - run: python tools/reproducible_build.py --output dist
      - name: Run installed deterministic conformance twice
        run: |
          python -m venv "${RUNNER_TEMP}/dm026-wheel"
          "${RUNNER_TEMP}/dm026-wheel/bin/python" -m pip install -r requirements-vectors.txt mcp==2.0.0
          "${RUNNER_TEMP}/dm026-wheel/bin/python" -m pip install --no-deps dist/daimon_matrix-0.0.0-py3-none-any.whl
          mkdir -p reports
          "${RUNNER_TEMP}/dm026-wheel/bin/daimon-conformance" --registry conformance/registry-v1.json --source-commit "${GITHUB_SHA}" --seed dm026-v1 --output reports/dm026-a.json --artifact wheel=dist/daimon_matrix-0.0.0-py3-none-any.whl --artifact sdist=dist/daimon_matrix-0.0.0.tar.gz
          "${RUNNER_TEMP}/dm026-wheel/bin/daimon-conformance" --registry conformance/registry-v1.json --source-commit "${GITHUB_SHA}" --seed dm026-v1 --output reports/dm026-b.json --artifact wheel=dist/daimon_matrix-0.0.0-py3-none-any.whl --artifact sdist=dist/daimon_matrix-0.0.0.tar.gz
          cmp reports/dm026-a.json reports/dm026-b.json
          python tools/scan_secrets.py reports dist/daimon_matrix-0.0.0.tar.gz dist/daimon_matrix-0.0.0-py3-none-any.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dm026-conformance-${{ github.sha }}
          path: reports/dm026-a.json
          if-no-files-found: error
