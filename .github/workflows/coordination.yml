name: coordination

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  command:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      (startsWith(github.event.comment.body, '/claim') ||
       startsWith(github.event.comment.body, '/heartbeat') ||
       startsWith(github.event.comment.body, '/review') ||
       startsWith(github.event.comment.body, '/release'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: daimon-coordination-mutations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-vectors.txt
      - run: python -m pip install -r requirements-vectors.txt
      - name: Validate command and append receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/github_coordination.py
          --repo "$GITHUB_REPOSITORY"
          handle-comment
          --issue "${{ github.event.issue.number }}"
          --comment "${{ github.event.comment.id }}"

  expiry:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    concurrency:
      group: daimon-coordination-mutations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-vectors.txt
      - run: python -m pip install -r requirements-vectors.txt
      - name: Release expired leases with receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/github_coordination.py
          --repo "$GITHUB_REPOSITORY"
          expire

  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Detect coordination baseline
        id: coordination
        shell: bash
        run: >-
          if [[ -f tools/github_coordination.py && -f coordination/principals.json ]];
          then echo 'enabled=true' >> "$GITHUB_OUTPUT";
          else echo 'enabled=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.coordination.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-vectors.txt
      - run: python -m pip install -r requirements-vectors.txt
        if: steps.coordination.outputs.enabled == 'true'
      - name: Audit PR against live review receipt
        if: steps.coordination.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/github_coordination.py
          --repo "$GITHUB_REPOSITORY"
          audit-pr
          --pr "${{ github.event.pull_request.number }}"
