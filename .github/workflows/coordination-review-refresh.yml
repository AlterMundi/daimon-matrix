name: coordination-review-refresh

on:
  workflow_run:
    workflows: [coordination]
    types: [completed]

permissions:
  contents: read

jobs:
  refresh:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: write
    concurrency:
      group: daimon-coordination-mutations
      cancel-in-progress: false
    steps:
      # No PR checkout, artifacts, caches or PR-supplied executable input.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-vectors.txt
      - name: Reconcile completed audit with current authenticated review
        env:
          GH_TOKEN: ${{ github.token }}
          COMPLETED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: >-
          python tools/github_coordination.py
          --repo "$GITHUB_REPOSITORY"
          refresh-completed-run --run "$COMPLETED_RUN_ID"
