[package]
name = "daimon-cards"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
