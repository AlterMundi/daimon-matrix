[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "daimon-matrix"
version = "0.0.0"
description = "Reference contracts for portable beings with plural AI embodiments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AlterMundi" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["cryptography==50.0.0", "mcp==2.0.0", "wasmtime==45.0.0"]

[project.scripts]
daimon = "daimon_matrix.cli:main"
daimon-conformance = "daimon_matrix.conformance:main"
daimon-codex-body = "daimon_matrix.codex_body:main"
daimon-curator-worker = "daimon_matrix.curator_worker_process:main"
daimon-hermes-body = "daimon_matrix.hermes_body:main"
daimon-mcp = "daimon_matrix.mcp_server:main"
daimon-matrixd = "daimon_matrix.daemon:main"
daimon-reviewer = "daimon_matrix.reviewer_cli:main"
daimon-synthetic-birth = "daimon_matrix.synthetic_birth:main"
daimon-synthetic-multihost = "daimon_matrix.synthetic_multihost:main"
daimon-synthetic-species = "daimon_matrix.synthetic_species:main"
daimon-synthetic-sources = "daimon_matrix.synthetic_sources:main"

[project.urls]
Homepage = "https://github.com/AlterMundi/daimon-matrix"
Issues = "https://github.com/AlterMundi/daimon-matrix/issues"
Source = "https://github.com/AlterMundi/daimon-matrix"

[tool.hatch.build]
reproducible = true
skip-excluded-dirs = true

[tool.hatch.build.targets.sdist]
only-include = ["src/daimon_matrix"]

[tool.hatch.build.targets.wheel]
packages = ["src/daimon_matrix"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
explicit_package_bases = true
